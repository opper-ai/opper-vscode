name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .vsix to the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, and the Marketplace will not let you reuse a
      # version number to correct it.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi

      - run: npm test
      - run: npx @vscode/vsce package --out "opper-vscode-${{ github.ref_name }}.vsix"

      - name: Publish to the Visual Studio Marketplace
        run: npx @vscode/vsce publish --packagePath opper-vscode-*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Attach the .vsix to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: opper-vscode-*.vsix
