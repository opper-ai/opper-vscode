name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # `release` gates this on whatever reviewers/rules you put on the
    # environment, and its name is what the Entra federated credential trusts —
    # so a workflow on another branch cannot mint a publishing token. The
    # credential's subject embeds this org's and repo's numeric ids (immutable
    # OIDC claims are enabled), so renaming the repo breaks the trust and the
    # credential has to be updated.
    environment: release
    permissions:
      id-token: write # mint the GitHub OIDC token azure/login exchanges
      contents: write # attach the .vsix to the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong version under
      # the right name, and the Marketplace will not let you reuse a version
      # number to correct it.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi

      - run: npm test
      - run: npx @vscode/vsce package --out "opper-vscode-${{ github.ref_name }}.vsix"

      # Exchanges the GitHub OIDC token for an Entra one. No secret is stored:
      # these three ids are not sensitive, and the token lives minutes.
      # allow-no-subscriptions matters — vsce asks for an Azure DevOps token
      # (499b84ac-1321-427f-aa17-267ca6975798), so the identity needs no Azure
      # subscription and no role assignment on one.
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # --azure-credential resolves through vsce's ChainedTokenCredential, whose
      # second link is AzureCliCredential — which the step above just signed in.
      - name: Publish to the Visual Studio Marketplace
        run: npx @vscode/vsce publish --azure-credential --packagePath opper-vscode-*.vsix

      - name: Attach the .vsix to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: opper-vscode-*.vsix
